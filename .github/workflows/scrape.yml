name: 更新報價並部署網站

on:
  schedule:
    # cron 是 UTC。01:30 UTC = 台北 09:30，週一到週五
    - cron: "30 1 * * 1-5"
  workflow_dispatch:
  push:
    branches: [main]
    paths: # 只改網站程式碼時也重新部署，不必等排程
      - "docs/**"
      - ".github/workflows/scrape.yml"

permissions:
  contents: write # commit 回 CSV 歷史
  pages: write # 部署 GitHub Pages
  id-token: write # Pages 部署用的 OIDC

concurrency:
  group: bond-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 抓取報價並計算殖利率
        run: python scrape.py

      - name: 把 CSV 歷史 commit 回 repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --staged --quiet; then
            echo "報價無異動，略過 commit"
          else
            git commit -m "data: 更新海外債券報價 ($(TZ=Asia/Taipei date '+%Y-%m-%d'))"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
